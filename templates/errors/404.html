{% extends "base.html" %}

{% block title %}Page Not Found | LeadCRM{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-card">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page may have moved, been deleted, or the link may be incorrect.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="{% url 'lead_capture' %}"><i class="bi bi-house"></i> Public Form</a>
      {% if user.is_authenticated %}
        <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Dashboard</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
