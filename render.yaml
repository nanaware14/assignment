services:
  - type: web
    name: lead-management-system
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn lead_management.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
databases:
  - name: lead-management-db
    plan: free
