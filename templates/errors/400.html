{% extends "base.html" %}

{% block title %}Bad Request | LeadCRM{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-card">
    <div class="error-code">400</div>
    <h1>Bad request</h1>
    <p>The request could not be processed. Please check the form data or try the page again.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="{% url 'lead_capture' %}"><i class="bi bi-house"></i> Public Form</a>
      {% if user.is_authenticated %}
        <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Dashboard</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
